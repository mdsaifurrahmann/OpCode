name: CodeQL

# Advanced setup, not GitHub's UI-managed Default Setup - required because
# the Swift target has no committed .xcodeproj/.xcworkspace for `autobuild`
# to find (x8086-mac/x8086.xcodeproj is generated from project.yml via
# `xcodegen generate`, same as every other CI job does). Default Setup has
# no way to run a custom build step before analysis, so it can only ever
# fail on the swift language here - this workflow builds it for real using
# the same steps ci.yml already uses, then lets CodeQL trace that build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            os: ubuntu-latest
          - language: rust
            build-mode: autobuild
            os: ubuntu-latest
          - language: swift
            build-mode: manual
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'rust'

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'swift'
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        if: matrix.language == 'rust' || matrix.language == 'swift'

      - name: Install XcodeGen
        if: matrix.language == 'swift'
        run: brew install xcodegen

      - name: Build universal x8086-ffi + XCFramework
        if: matrix.language == 'swift'
        run: ./scripts/build-universal.sh

      - name: Generate Xcode project
        if: matrix.language == 'swift'
        working-directory: x8086-mac
        run: xcodegen generate

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/autobuild@v3
        if: matrix.build-mode == 'autobuild'

      - name: Build (Swift, traced by CodeQL)
        if: matrix.language == 'swift'
        working-directory: x8086-mac
        run: |
          xcodebuild build \
            -project x8086.xcodeproj \
            -scheme x8086 \
            -destination 'platform=macOS'

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
